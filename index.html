<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intimacy in Transit</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Helvetica, Arial, sans-serif;
  overflow: hidden;
}

header {
  position: absolute;
  top: 0;
  width: 100%;
  padding: 30px;
  text-align: center;
  font-size: 13px;
  letter-spacing: 4px;
  z-index: 2;
}

#viewer {
  width: 100vw;
  height: 100vh;
}

#viewer canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
}

#viewer canvas:active {
  cursor: grabbing;
}

#status {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #888;
  font-size: 11px;
  letter-spacing: 2px;
  text-align: center;
  width: 85%;
  line-height: 1.8;
  z-index: 3;
  pointer-events: none;
}

footer {
  position: absolute;
  bottom: 25px;
  right: 30px;
  display: flex;
  gap: 25px;
  font-size: 10px;
  letter-spacing: 1px;
  color: #777;
  z-index: 2;
}

footer a {
  color: inherit;
  text-decoration: none;
}

footer a:hover {
  color: white;
}
</style>
</head>

<body>

<header>INTIMACY IN TRANSIT</header>

<div id="viewer"></div>
<div id="status">STARTING...</div>

<footer>
  <a href="#" onclick="alert('About this spatial fragment.'); return false;">ABOUT</a>
  <a href="#" onclick="alert('Credits: Scaniverse / Independent Digital Exhibition.'); return false;">CREDITS</a>
</footer>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
  }
}
</script>

<script type="module">

const status = document.getElementById('status');
const viewer = document.getElementById('viewer');

const MODEL_URL =
'https://res.cloudinary.com/kramdp60/raw/upload/v1794491467/chais_bb_gk2icx.spz';

async function start() {

  try {

    status.textContent = 'LOADING THREE.JS...';

    const THREE = await import('three');

    status.textContent = 'LOADING SPARK...';

    const { SparkRenderer, SplatMesh } =
      await import('@sparkjsdev/spark');

    status.textContent = 'CREATING VIEWER...';

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.01,
      10000
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: false
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    viewer.appendChild(renderer.domElement);

    const spark = new SparkRenderer({
      renderer: renderer
    });

    scene.add(spark);

    status.textContent = 'DOWNLOADING 3D MODEL...';

    const splat = new SplatMesh({
      url: MODEL_URL,
      onProgress: (event) => {
        if (event.lengthComputable) {
          const percent = Math.round(
            event.loaded / event.total * 100
          );
          status.textContent = 'LOADING ' + percent + '%';
        }
      }
    });

    scene.add(splat);

    await splat.initialized;

    status.textContent = 'PREPARING MODEL...';

    // Center model

    const bounds = splat.getBoundingBox();

    const center = bounds.getCenter(
      new THREE.Vector3()
    );

    const size = bounds.getSize(
      new THREE.Vector3()
    );

    splat.position.sub(center);

    // Camera positioning

    const maxDimension = Math.max(
      size.x,
      size.y,
      size.z
    );

    const distance = Math.max(
      maxDimension * 2.5,
      1
    );

    camera.position.set(0, 0, distance);
    camera.lookAt(0, 0, 0);

    // Horizontal rotation

    let dragging = false;
    let previousX = 0;

    const canvas = renderer.domElement;

    canvas.addEventListener('pointerdown', (e) => {
      dragging = true;
      previousX = e.clientX;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointerup', () => {
      dragging = false;
    });

    canvas.addEventListener('pointercancel', () => {
      dragging = false;
    });

    canvas.addEventListener('pointermove', (e) => {

      if (!dragging) return;

      const delta = e.clientX - previousX;

      splat.rotation.y += delta * 0.005;

      previousX = e.clientX;

    });

    status.style.display = 'none';

    // Animation

    renderer.setAnimationLoop(() => {

      if (!dragging) {
        splat.rotation.y += 0.0015;
      }

      renderer.render(scene, camera);

    });

    // Responsive

    window.addEventListener('resize', () => {

      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

    });

  } catch (error) {

    console.error('VIEWER ERROR:', error);

    status.style.display = 'block';

    status.textContent =
      'ERROR: ' + (error.message || String(error));

  }

}

start();

</script>

</body>
</html>
