
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Intimacy in Transit</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Helvetica, Arial, sans-serif;
  overflow: hidden;
}

header {
  position: absolute;
  top: 0;
  width: 100%;
  padding: 30px;
  text-align: center;
  font-size: 13px;
  letter-spacing: 4px;
  font-weight: 400;
  z-index: 2;
  pointer-events: none;
}

#viewer {
  width: 100vw;
  height: 100vh;
  position: relative;
}

#viewer canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
}

#viewer canvas:active {
  cursor: grabbing;
}

/* LOADING MESSAGE */

#status {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #888;
  font-size: 11px;
  letter-spacing: 2px;
  text-align: center;
  width: 85%;
  line-height: 1.8;
  z-index: 3;
  pointer-events: none;
}

/* CAROUSEL ARROWS */

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 5;
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.55);
  font-size: 28px;
  font-weight: 200;
  cursor: pointer;
  padding: 20px;
  transition: color 0.3s ease;
}

.arrow:hover {
  color: white;
}

#previous {
  left: 15px;
}

#next {
  right: 15px;
}

/* MODEL COUNTER */

#model-counter {
  position: absolute;
  bottom: 28px;
  left: 30px;
  font-size: 10px;
  letter-spacing: 2px;
  color: #777;
  z-index: 2;
  pointer-events: none;
}

/* FOOTER */

footer {
  position: absolute;
  bottom: 25px;
  right: 30px;
  display: flex;
  gap: 25px;
  font-size: 10px;
  letter-spacing: 1px;
  color: #777;
  z-index: 2;
}

footer a {
  color: inherit;
  text-decoration: none;
  cursor: pointer;
}

footer a:hover {
  color: white;
}

/* MOBILE */

@media (max-width: 600px) {

  header {
    padding: 25px 10px;
    font-size: 11px;
    letter-spacing: 3px;
  }

  #previous {
    left: 0;
  }

  #next {
    right: 0;
  }

  .arrow {
    font-size: 25px;
    padding: 15px;
  }

  footer {
    right: 20px;
    bottom: 22px;
    gap: 15px;
  }

  #model-counter {
    left: 20px;
    bottom: 25px;
  }

}

</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/": "https://cdn.jsdelivr.net/npm/three@0.180.0/",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
  }
}
</script>

</head>

<body>

<header>
  INTIMACY IN TRANSIT
</header>

<div id="viewer"></div>

<div id="status">
  LOADING SPATIAL FRAGMENTS...
</div>

<button
  class="arrow"
  id="previous"
  aria-label="Previous 3D model">
  &#8249;
</button>

<button
  class="arrow"
  id="next"
  aria-label="Next 3D model">
  &#8250;
</button>

<div id="model-counter">
  01 / 09
</div>

<footer>

  <a href="#" onclick="alert('About this spatial fragment.'); return false;">
    ABOUT
  </a>

  <a href="#" onclick="alert('Credits: Scaniverse / SuperSplat / Independent Digital Exhibition.'); return false;">
    CREDITS
  </a>

</footer>


<script type="module">

import * as THREE from 'three';

import {
  SparkRenderer,
  SplatMesh
} from '@sparkjsdev/spark';

import {
  GLTFLoader
} from 'three/addons/loaders/GLTFLoader.js';


// ==========================================
// ALL 3D MODELS
// ==========================================

const MODELS = [

  {
    name: 'CHAIR',
    type: 'spz',
    url: 'https://res.cloudinary.com/kramdp60/raw/upload/v1795039239/chais_bb_clean_sqleij.spz'
  },

   {
    name: 'BESOIN DAIDE',
    type: 'spz',
    url: 'https://res.cloudinary.com/kramdp60/raw/upload/v1795112716/besoin_daideCLEANN_cgyrxi.spz'
  },

  {
    name: 'RAILS',
    type: 'glb',
    url: 'https://res.cloudinary.com/kramdp60/image/upload/v1795111516/railss_couloirs_vzqxr3.glb'
  },

  {
    name: 'DOORS',
    type: 'glb',
    url: 'https://res.cloudinary.com/kramdp60/image/upload/v1795112711/portes144_sdbtit.glb'
  },

  {
    name: 'LINES',
    type: 'glb',
    url: 'https://res.cloudinary.com/kramdp60/image/upload/v1795112712/regles_ligne14_zq1s4p.glb'
  },

  {
    name: 'WHITE CHAIRS',
    type: 'glb',
    url: 'https://res.cloudinary.com/kramdp60/image/upload/v1795112713/chaises_blanches_nhba9p.glb'
  },

  {
    name: 'SIGN',
    type: 'glb',
    url: 'https://res.cloudinary.com/kramdp60/image/upload/v1795112714/panneau_mirosl_binza8.glb'
  },

  {
    name: 'MACHINE',
    type: 'glb',
    url: 'https://res.cloudinary.com/kramdp60/image/upload/v1795112715/machine_st_laz_tgnhqf.glb'
  },

  {
    name: 'MAPS',
    type: 'glb',
    url: 'https://res.cloudinary.com/kramdp60/image/upload/v1795112718/maps_eqnvdl.glb'
  }

];


// ==========================================
// ELEMENTS
// ==========================================

const viewer = document.getElementById('viewer');

const status = document.getElementById('status');

const counter = document.getElementById('model-counter');


// ==========================================
// VARIABLES
// ==========================================

let currentIndex = 0;

let activePivot = null;

let dragging = false;

let previousX = 0;

const pivots = [];

const distances = [];


// ==========================================
// START
// ==========================================

async function start() {

  try {

    status.textContent = 'INITIALIZING...';


    // SCENE

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x000000);


    // CAMERA

    const camera = new THREE.PerspectiveCamera(
      45,
      viewer.clientWidth / viewer.clientHeight,
      0.01,
      10000
    );


    // RENDERER

    const renderer = new THREE.WebGLRenderer({
      antialias: false
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      viewer.clientWidth,
      viewer.clientHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    viewer.appendChild(renderer.domElement);


    // LIGHTING FOR GLB

    const ambientLight = new THREE.HemisphereLight(
      0xffffff,
      0x444444,
      2
    );

    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(
      0xffffff,
      2
    );

    directionalLight.position.set(5, 10, 7);

    scene.add(directionalLight);


    // SPARK

    status.textContent = 'INITIALIZING SPARK...';

    const spark = new SparkRenderer({
      renderer: renderer
    });

    scene.add(spark);


    // GLB LOADER

    const gltfLoader = new GLTFLoader();


    // ======================================
    // LOAD MODEL
    // ======================================

    async function loadModel(config, index) {

      status.textContent =
        'LOADING MODEL ' +
        String(index + 1).padStart(2, '0') +
        ' / ' +
        String(MODELS.length).padStart(2, '0');

      let object;

      let center;

      let size;


      // ==================================
      // SPZ MODELS
      // ==================================

      if (config.type === 'spz') {

        object = new SplatMesh({
          url: config.url
        });

        scene.add(object);

        await object.initialized;

        // ORIGINAL SPARK BOUNDING BOX

        const bounds = object.getBoundingBox();

        center = bounds.getCenter(
          new THREE.Vector3()
        );

        size = bounds.getSize(
          new THREE.Vector3()
        );

        // CREATE PIVOT

        const pivot = new THREE.Group();

        scene.add(pivot);

        // ORIGINAL WORKING CENTERING METHOD

        object.position.set(
          -center.x,
          -center.y,
          -center.z
        );

        pivot.add(object);

        pivot.position.set(0, 0, 0);

        pivots.push(pivot);

      }


      // ==================================
      // GLB MODELS
      // ==================================

     
else if (config.type === 'glb') {

  const gltf = await gltfLoader.loadAsync(config.url);

  object = gltf.scene;

  // UPDATE ORIGINAL TRANSFORMS
  object.updateMatrixWorld(true);

  // GET ACTUAL WORLD BOUNDS
  const bounds = new THREE.Box3().setFromObject(object);

  center = bounds.getCenter(new THREE.Vector3());

  size = bounds.getSize(new THREE.Vector3());

  // CREATE PIVOT AT THE WORLD ORIGIN
  const pivot = new THREE.Group();

  scene.add(pivot);

  // PRESERVE THE MODEL'S WORLD TRANSFORM
  const worldPosition = new THREE.Vector3();
  const worldQuaternion = new THREE.Quaternion();
  const worldScale = new THREE.Vector3();

  object.matrixWorld.decompose(
    worldPosition,
    worldQuaternion,
    worldScale
  );

  // DETACH FROM ORIGINAL PARENT
  object.removeFromParent();

  // ADD TO CENTERED PIVOT
  pivot.add(object);

  // APPLY CENTER CORRECTION
  object.position.set(
    worldPosition.x - center.x,
    worldPosition.y - center.y,
    worldPosition.z - center.z
  );

  object.quaternion.copy(worldQuaternion);
  object.scale.copy(worldScale);

  pivot.position.set(0, 0, 0);

  // STORE PIVOT
  pivots.push(pivot);

}

      // ==================================
      // MOBILE-FRIENDLY CAMERA DISTANCE
      // ==================================

      const maxDimension = Math.max(
        size.x,
        size.y,
        size.z
      );

      const verticalFOV = THREE.MathUtils.degToRad(
        camera.fov
      );

      const horizontalFOV = 2 * Math.atan(
        Math.tan(verticalFOV / 2) * camera.aspect
      );

      const limitingFOV = Math.min(
        verticalFOV,
        horizontalFOV
      );

      const distance = Math.max(
        maxDimension /
        (2 * Math.tan(limitingFOV / 2)) * 1.5,
        1
      );

      distances.push(distance);


      // HIDE UNTIL SELECTED

      pivots[pivots.length - 1].visible = false;


      console.log(
        'MODEL CENTERED:',
        config.name,
        center,
        size,
        distance
      );

    }


    // ======================================
    // LOAD ALL MODELS
    // ======================================

    for (
      let i = 0;
      i < MODELS.length;
      i++
    ) {

      await loadModel(
        MODELS[i],
        i
      );

    }


    // ======================================
    // SHOW MODEL
    // ======================================

    function showModel(index) {

      currentIndex =
        (index + MODELS.length) % MODELS.length;

      // HIDE OTHER MODELS

      pivots.forEach((pivot, i) => {

        pivot.visible = i === currentIndex;

      });

      // ACTIVE MODEL

      activePivot = pivots[currentIndex];

      // CAMERA

      camera.position.set(
        0,
        0,
        distances[currentIndex]
      );

      camera.lookAt(0, 0, 0);

      camera.updateProjectionMatrix();

      // COUNTER

      counter.textContent =
        String(currentIndex + 1).padStart(2, '0') +
        ' / ' +
        String(MODELS.length).padStart(2, '0');

      console.log(
        'CURRENT MODEL:',
        MODELS[currentIndex].name
      );

    }


    // ======================================
    // PREVIOUS MODEL
    // ======================================

    document
      .getElementById('previous')
      .addEventListener('click', () => {

        showModel(currentIndex - 1);

      });


    // ======================================
    // NEXT MODEL
    // ======================================

    document
      .getElementById('next')
      .addEventListener('click', () => {

        showModel(currentIndex + 1);

      });


    // FIRST MODEL

    showModel(0);


    // ======================================
    // ROTATION
    // ======================================

    const canvas = renderer.domElement;

    canvas.addEventListener('pointerdown', (e) => {

      dragging = true;

      previousX = e.clientX;

      canvas.setPointerCapture(e.pointerId);

    });

    canvas.addEventListener('pointerup', () => {

      dragging = false;

    });

    canvas.addEventListener('pointercancel', () => {

      dragging = false;

    });

    canvas.addEventListener('pointermove', (e) => {

      if (!dragging || !activePivot) return;

      const delta = e.clientX - previousX;

      activePivot.rotation.y += delta * 0.005;

      previousX = e.clientX;

    });


    // ======================================
    // HIDE LOADING
    // ======================================

    status.style.display = 'none';


    // ======================================
    // AUTOMATIC ROTATION
    // ======================================

    renderer.setAnimationLoop(() => {

      if (!dragging && activePivot) {

        activePivot.rotation.y += 0.0015;

      }

      renderer.render(scene, camera);

    });


    // ======================================
    // RESPONSIVE
    // ======================================

    window.addEventListener('resize', () => {

      const width = viewer.clientWidth;

      const height = viewer.clientHeight;

      camera.aspect = width / height;

      camera.updateProjectionMatrix();

      renderer.setSize(
        width,
        height
      );

    });


    console.log('ALL MODELS LOADED SUCCESSFULLY');


  }

  catch (error) {

    console.error('MODEL ERROR:', error);

    status.style.display = 'block';

    status.textContent =
      'MODEL FAILED: ' + error.message;

  }

}


// ==========================================
// RUN
// ==========================================

start();

</script>

</body>
</html>
