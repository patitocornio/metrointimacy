<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Intimacy in Transit</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Helvetica, Arial, sans-serif;
  overflow: hidden;
}

header {
  position: absolute;
  top: 0;
  width: 100%;
  padding: 30px;
  text-align: center;
  font-size: 13px;
  letter-spacing: 4px;
  font-weight: 400;
  z-index: 2;
  pointer-events: none;
}

#viewer {
  width: 100vw;
  height: 100vh;
}

#viewer canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: pan-y;
}

#viewer canvas:active {
  cursor: grabbing;
}

#status {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #888;
  font-size: 11px;
  letter-spacing: 2px;
  text-align: center;
  width: 85%;
  line-height: 1.8;
  z-index: 3;
  pointer-events: none;
}

footer {
  position: absolute;
  bottom: 25px;
  right: 30px;
  display: flex;
  gap: 25px;
  font-size: 10px;
  letter-spacing: 1px;
  color: #777;
  z-index: 2;
}

footer a {
  color: inherit;
  text-decoration: none;
  cursor: pointer;
}

footer a:hover {
  color: white;
}
</style>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/": "https://cdn.jsdelivr.net/npm/three@0.180.0/",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
  }
}
</script>


</head>

<body>

<header>
  INTIMACY IN TRANSIT
</header>

<div id="viewer"></div>

<div id="status">
  LOADING SPATIAL FRAGMENT...
</div>

<footer>
  <a href="#" onclick="alert('About this spatial fragment.'); return false;">ABOUT</a>
  <a href="#" onclick="alert('Credits: Scaniverse / SuperSplat / Independent Digital Exhibition.'); return false;">CREDITS</a>
</footer>

<script type="module">

import * as THREE from 'three';

import {
  SparkRenderer,
  SplatMesh
} from '@sparkjsdev/spark';

// YOUR NEW CLEANED MODEL

const MODEL_URL =
'https://res.cloudinary.com/kramdp60/raw/upload/v1795039239/chais_bb_clean_sqleij.spz';

const viewer = document.getElementById('viewer');
const status = document.getElementById('status');

async function start() {

  try {

    status.textContent = 'INITIALIZING...';

    // SCENE

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x000000);

    // CAMERA

    const camera = new THREE.PerspectiveCamera(
      45,
      viewer.clientWidth / viewer.clientHeight,
      0.01,
      10000
    );

    // RENDERER

    const renderer = new THREE.WebGLRenderer({
      antialias: false
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      viewer.clientWidth,
      viewer.clientHeight
    );

    viewer.appendChild(renderer.domElement);

    // SPARK

    const spark = new SparkRenderer({
      renderer: renderer
    });

    scene.add(spark);

    // LOAD GAUSSIAN SPLAT

    status.textContent = 'LOADING 3D MODEL...';

    const splat = new SplatMesh({
      url: MODEL_URL
    });

    scene.add(splat);

    await splat.initialized;

    status.textContent = 'PREPARING MODEL...';


    // CENTER MODEL AROUND ITS TRUE MIDDLE

    const bounds = splat.getBoundingBox();

    const center = bounds.getCenter(
      new THREE.Vector3()
    );

    const size = bounds.getSize(
      new THREE.Vector3()
    );

    // Create a pivot at the model's center

    const pivot = new THREE.Group();

    scene.add(pivot);

    // Move the model relative to the pivot

    pivot.position.copy(center);
    splat.position.set(
      -center.x,
      -center.y,
      -center.z
    );

    pivot.add(splat);

    // CAMERA DISTANCE - KEEP YOUR CURRENT SIZE

    const maxDimension = Math.max(
      size.x,
      size.y,
      size.z
    );

    const distance = Math.max(
      maxDimension * 2.5,
      1
    );

    camera.position.set(
      0,
      0,
      distance
    );

    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();


// HORIZONTAL ROTATION ONLY

let dragging = false;
let previousX = 0;

const canvas = renderer.domElement;

canvas.addEventListener('pointerdown', (e) => {
  dragging = true;
  previousX = e.clientX;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener('pointerup', () => {
  dragging = false;
});

canvas.addEventListener('pointercancel', () => {
  dragging = false;
});

canvas.addEventListener('pointermove', (e) => {

  if (!dragging) return;

  const delta = e.clientX - previousX;

  pivot.rotation.y += delta * 0.005;

  previousX = e.clientX;

});

    // HIDE LOADING MESSAGE

    status.style.display = 'none';

    // ANIMATION

    renderer.setAnimationLoop(() => {

      if (!dragging) {
        splat.rotation.y += 0.0015;
      }

      renderer.render(scene, camera);

    });

    // RESPONSIVE

    window.addEventListener('resize', () => {

      camera.aspect =
        viewer.clientWidth / viewer.clientHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        viewer.clientWidth,
        viewer.clientHeight
      );

    });

    console.log('CLEANED MODEL LOADED SUCCESSFULLY');

  } catch (error) {

    console.error('MODEL ERROR:', error);

    status.style.display = 'block';

    status.textContent =
      'MODEL FAILED: ' + error.message;

  }

}

start();

</script>

</body>
</html>
