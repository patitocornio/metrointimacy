<style>

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Helvetica, Arial, sans-serif;
  overflow: hidden;
}

header {
  position: absolute;
  top: 0;
  width: 100%;
  padding: 30px;
  text-align: center;
  font-size: 13px;
  letter-spacing: 4px;

}

#subtitle {

  top: 65px;

  text-align: center;

  color: #777;
  font-weight: 400;
  z-index: 2;
  pointer-events: none;
}

#viewer {
  width: 100vw;
  height: 100vh;
  position: relative;
}

#viewer canvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
}

#viewer canvas:active { cursor: grabbing; }

#status {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #888;
  font-size: 11px;
  letter-spacing: 2px;
  text-align: center;
  width: 85%;
  line-height: 1.8;
  z-index: 3;
  pointer-events: none;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 5;
  background: transparent;
  border: none;
  color: rgba(255,255,255,0.55);
  font-size: 28px;
  font-weight: 200;
  cursor: pointer;
  padding: 20px;
  transition: color 0.3s ease;
}

.arrow:hover { color: white; }
#previous { left: 15px; }
#next { right: 15px; }

#model-counter {
  position: absolute;
  bottom: 28px;
  left: 30px;
  font-size: 10px;
  letter-spacing: 2px;
  color: #777;
  z-index: 2;

}

footer {
  position: absolute;
  bottom: 25px;
  right: 30px;
  display: flex;
  gap: 25px;
  font-size: 10px;
  letter-spacing: 1px;
  color: #777;
  z-index: 2;
}

footer a { color: inherit; text-decoration: none; cursor: pointer; }
footer a { transition: color 0.3s ease; }
footer a:hover,
footer a.active { color: white; }

/* ABOUT / CREDITS: everything fades except the footer */
body.info #viewer,
body.info header,
body.info #subtitle,
body.info #tags,
body.info .arrow,
body.info #model-counter {
  opacity: 0;
  pointer-events: none;
}

body.info footer { z-index: 22; }

/* ==========================================
   ANECDOTE TAGS (dot + 45° line + title)
   ========================================== */

#tags {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  overflow: hidden;
}

.tag {
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  display: none;
}

.tag.on { display: block; }

.dot {
  position: absolute;
  left: -3px;
  top: -3px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #fff;
}

.diag {
  position: absolute;
  left: 0;
  top: 0;
  width: 57px;            /* 40px * sqrt(2) = 40px up, 40px across */
  height: 1px;
  background: rgba(255,255,255,0.8);
  transform-origin: 0 0;
  transform: rotate(-45deg);
}

.tag.left .diag { transform: rotate(-135deg); }
.tag.down .diag { transform: rotate(45deg); }
.tag.down.left .diag { transform: rotate(135deg); }

.title {
  position: absolute;
  left: 40px;
  top: -40px;
  transform: translateY(-100%);
  width: 230px;
  padding: 0 4px 5px 0;
  border-bottom: 1px solid rgba(255,255,255,0.8);
  font-size: 11px;
  line-height: 1.5;
  letter-spacing: 1.5px;
  color: #fff;
  text-align: left;
  cursor: pointer;
  pointer-events: auto;
  transition: color 0.3s ease, border-color 0.3s ease;
}

.tag.left .title {
  left: -40px;
  transform: translate(-100%, -100%);
  text-align: right;
  padding: 0 0 5px 4px;
}

.tag.down .title {
  top: 40px;
  transform: none;
  border-bottom: none;
  border-top: 1px solid rgba(255,255,255,0.8);
  padding: 5px 4px 0 0;
}

.tag.down.left .title {
  left: -40px;
  transform: translateX(-100%);
  padding: 5px 0 0 4px;
}

.tag .title:hover { color: #aaa; border-color: #aaa; }

/* ==========================================
   FADE OUT + READER
   ========================================== */

#viewer, header, #subtitle, #tags, .arrow, #model-counter, footer {
  transition: opacity 0.7s ease;
}

body.reading #viewer,
body.reading header,
body.reading #subtitle,
body.reading #tags,
body.reading .arrow,
body.reading #model-counter,
body.reading footer {
  opacity: 0;
  pointer-events: none;
}

#reader {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  overflow-y: auto;
  padding: 90px 30px 80px;
}

#reader.open { display: block; }

#reader-inner {
  max-width: 620px;
  margin: 0 auto;
}

#r-title {
  width: 230px;
  margin: 0 0 40px;
  padding: 0 4px 5px 0;
  border-bottom: 1px solid rgba(255,255,255,0.8);
  font-size: 11px;
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: 1.5px;
  color: #fff;
}

#r-title.moving { transition: transform 1s cubic-bezier(.6,.05,.2,1); }

#r-text {
  font-size: 11px;
  line-height: 1.9;
  letter-spacing: 1.5px;
  color: #fff;
  opacity: 0;
  transition: opacity 1s ease;
}

#r-text p { margin: 0 0 1.2em; }
#r-text.show { opacity: 1; }

/* ABOUT / CREDITS text: same font, size and spacing as the footer links */
#r-text.info {
  font-family: Helvetica, Arial, sans-serif;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 1px;
  line-height: 1.9;
  color: #777;
  -webkit-font-smoothing: antialiased;
}

#close {
  position: fixed;
  top: 22px;
  right: 24px;
  z-index: 21;
  width: 36px;
  height: 36px;
  padding: 0;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 0;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}

#close::before,
#close::after {
  content: "";
  position: absolute;
  left: 11px;
  top: 17px;
  width: 14px;
  height: 1px;
  background: currentColor;
  opacity: 0.4;
  transition: opacity 0.3s ease;
}

#close::before { transform: rotate(45deg); }
#close::after { transform: rotate(-45deg); }
#close:hover::before,
#close:hover::after { opacity: 0.9; }

#close.show { opacity: 1; pointer-events: auto; }

@media (max-width: 600px) {
  header { padding: 25px 10px; font-size: 11px; letter-spacing: 3px; }
  #previous { left: 0; }

  .arrow { font-size: 25px; padding: 15px; }

  #r-text { font-size: 10px; letter-spacing: 1px; }
  #reader { padding: 80px 22px 60px; }
}

  { name: 'WHITE CHAIRS', type: 'glb', url: 'https://res.cloudinary.com/kramdp60/image/upload/v1795112713/chaises_blanches_nhba9p.glb' },
  { name: 'SIGN', type: 'glb', url: 'https://res.cloudinary.com/kramdp60/image/upload/v1795112714/panneau_mirosl_binza8.glb' },
  { name: 'MACHINE', type: 'glb', url: 'https://res.cloudinary.com/kramdp60/image/upload/v1795112715/machine_st_laz_tgnhqf.glb' },
  { name: 'MAPS', type: 'glb', url: 'https://res.cloudinary.com/kramdp60/image/upload/v1795112718/maps_eqnvdl.glb' }
];


// ==========================================
// ELEMENTS
// ==========================================

const viewer = document.getElementById('viewer');
const status = document.getElementById('status');
const counter = document.getElementById('model-counter');
const tagsLayer = document.getElementById('tags');
const reader = document.getElementById('reader');
const rTitle = document.getElementById('r-title');
const rText = document.getElementById('r-text');
const closeBtn = document.getElementById('close');


// ==========================================
// VARIABLES
// ==========================================

let currentIndex = 0;
let activePivot = null;
let dragging = false;
let hoveringTag = false;
let previousX = 0;

const pivots = [];
const distances = [];
const sizes = [];
const tagGroups = [];   // per model: [{ el, anchor, side }]


// ==========================================
// ANECDOTE READER
// ==========================================

let lastTitleRect = null;

function openAnecdote(anecdote, titleEl) {

  lastTitleRect = titleEl.getBoundingClientRect();

  rTitle.style.display = '';
  rText.classList.remove('info');
  rTitle.textContent = anecdote.title;
  rText.innerHTML = anecdote.text
    .split(/\n\s*\n/)
    .map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>')
    .join('');
  rText.classList.remove('show');
  reader.scrollTop = 0;

  reader.classList.add('open');

  // Place the reader title exactly over the clicked title
  const finalRect = rTitle.getBoundingClientRect();
  rTitle.classList.remove('moving');
  rTitle.style.transform =
    'translate(' + (lastTitleRect.left - finalRect.left) + 'px,' +
    (lastTitleRect.top - finalRect.top) + 'px)';
  void rTitle.offsetWidth;

  // Site fades out, title travels up
  document.body.classList.add('reading');

  setTimeout(() => {
    rTitle.classList.add('moving');
    rTitle.style.transform = 'translate(0,0)';
  }, 500);

  setTimeout(() => {
    rText.classList.add('show');
    closeBtn.classList.add('show');
  }, 1300);

}

function closeAnecdote() {

  closeBtn.classList.remove('show');
  rText.classList.remove('show');
  rTitle.style.transition = 'opacity 0.5s ease';
  rTitle.style.opacity = '0';

  setTimeout(() => {

    reader.classList.remove('open');
    rTitle.style.transition = '';
    rTitle.style.opacity = '';
    rTitle.style.transform = '';
    document.body.classList.remove('reading');

  }, 550);

}

// ==========================================
// ABOUT / CREDITS (same reader, no title)
// ==========================================

const INFO = {

  about: `Projet inspiré de [X] et [Y] sur l'intimité. Je voulais l'amener dans le métro : j'ai donc scanné le métro et trouvé des anecdotes d'internautes sur Reddit pour consolider cette page.`,

  credits: `Projet réalisé dans le cadre du cours de code et interactivité de ma 3ème année de licence à l'ENSAD, avec les professeurs Françoise et Benoît.`

};

let infoKey = null;

function showInfo(key) {

  if (infoKey === key) { closeInfo(); return; }

  const first = infoKey === null;
  infoKey = key;

  document.querySelectorAll('footer a').forEach(a => {
    a.classList.toggle('active', a.dataset.info === key);
  });

  document.body.classList.add('info');
  rText.classList.remove('show');

  setTimeout(() => {

    rTitle.style.display = 'none';
    rText.classList.add('info');
    rText.innerHTML = '<p>' + INFO[key] + '</p>';
    reader.scrollTop = 0;
    reader.classList.add('open');
    void rText.offsetWidth;
    rText.classList.add('show');
    closeBtn.classList.add('show');

  }, first ? 700 : 500);

}

function closeInfo() {

  infoKey = null;
  closeBtn.classList.remove('show');
  rText.classList.remove('show');
  document.querySelectorAll('footer a').forEach(a => a.classList.remove('active'));
  document.body.classList.remove('info');

  setTimeout(() => {
    if (infoKey !== null) return;
    reader.classList.remove('open');
    rTitle.style.display = '';
    rText.classList.remove('info');
  }, 700);

}

document.querySelectorAll('footer a').forEach(a => {
  a.addEventListener('click', (e) => {
    e.preventDefault();
    showInfo(a.dataset.info);
  });
});

closeBtn.addEventListener('click', () => {
  if (infoKey) closeInfo(); else closeAnecdote();
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (infoKey) closeInfo();
  else if (reader.classList.contains('open')) closeAnecdote();
});


// ==========================================
// START
// ==========================================

async function start() {

  try {

    status.textContent = 'INITIALIZING...';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
      45,
      viewer.clientWidth / viewer.clientHeight,
      0.01,
      10000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(viewer.clientWidth, viewer.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewer.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

    const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
    directionalLight.position.set(5, 10, 7);
    scene.add(directionalLight);

    status.textContent = 'INITIALIZING SPARK...';

    const spark = new SparkRenderer({ renderer: renderer });
    scene.add(spark);

    const gltfLoader = new GLTFLoader();


    // ======================================
    // LOAD MODEL
    // ======================================

    async function loadModel(config, index) {

      status.textContent =
        'LOADING MODEL ' +
        String(index + 1).padStart(2, '0') +
        ' / ' +
        String(MODELS.length).padStart(2, '0');

      let object;
      let center;
      let size;

      if (config.type === 'spz') {

        object = new SplatMesh({ url: config.url });
        scene.add(object);
        await object.initialized;

        const bounds = object.getBoundingBox();
        center = bounds.getCenter(new THREE.Vector3());
        size = bounds.getSize(new THREE.Vector3());

        const pivot = new THREE.Group();
        scene.add(pivot);

        object.position.set(-center.x, -center.y, -center.z);
        pivot.add(object);
        pivot.position.set(0, 0, 0);

        pivots.push(pivot);

      }

      else if (config.type === 'glb') {

        const gltf = await gltfLoader.loadAsync(config.url);
        object = gltf.scene;

        object.updateMatrixWorld(true);

        const bounds = new THREE.Box3().setFromObject(object);
        center = bounds.getCenter(new THREE.Vector3());
        size = bounds.getSize(new THREE.Vector3());

        const pivot = new THREE.Group();
        scene.add(pivot);

        const worldPosition = new THREE.Vector3();
        const worldQuaternion = new THREE.Quaternion();
        const worldScale = new THREE.Vector3();

        object.matrixWorld.decompose(worldPosition, worldQuaternion, worldScale);

        object.removeFromParent();
        pivot.add(object);

        object.position.set(
          worldPosition.x - center.x,
          worldPosition.y - center.y,
          worldPosition.z - center.z
        );

        object.quaternion.copy(worldQuaternion);
        object.scale.copy(worldScale);

        pivot.position.set(0, 0, 0);
        pivots.push(pivot);

      }

      // CAMERA DISTANCE

      const maxDimension = Math.max(size.x, size.y, size.z);
      const verticalFOV = THREE.MathUtils.degToRad(camera.fov);
      const horizontalFOV = 2 * Math.atan(Math.tan(verticalFOV / 2) * camera.aspect);
      const limitingFOV = Math.min(verticalFOV, horizontalFOV);

      const distance = Math.max(
        maxDimension / (2 * Math.tan(limitingFOV / 2)) * 1.5,
        1
      );

      distances.push(distance);
      sizes.push(size.clone());

      const pivot = pivots[pivots.length - 1];
      pivot.visible = false;


      // ==================================
      // ANECDOTE TAGS ATTACHED TO THE MODEL
      // ==================================

      const list = ANECDOTES[config.name] || [];

      // anchors sit just outside the model, as a fraction of its size:
      // [x, y, goes down?, text on the left?]  1st above, 2nd below, 3rd above
      const spots = [
        [-0.22,  0.58, false, false],
        [ 0.22, -0.58, true,  true ],
        [ 0.30,  0.72, false, true ]
      ];

      const group = list.slice(0, 3).map((anecdote, k) => {

        const anchor = new THREE.Object3D();

        anchor.position.set(
          spots[k][0] * size.x,
          spots[k][1] * size.y,
          0
        );

        pivot.add(anchor);

        const el = document.createElement('div');
        el.className = 'tag' + (spots[k][2] ? ' down' : '') + (spots[k][3] ? ' left' : '');
        el.innerHTML =
          '<i class="dot"></i><i class="diag"></i><div class="title"></div>';

        const titleEl = el.querySelector('.title');
        titleEl.textContent = anecdote.title;

        titleEl.addEventListener('click', () => openAnecdote(anecdote, titleEl));
        titleEl.addEventListener('pointerenter', () => { hoveringTag = true; });
        titleEl.addEventListener('pointerleave', () => { hoveringTag = false; });

        tagsLayer.appendChild(el);

        return { el, anchor };

      });

      tagGroups.push(group);

      console.log('MODEL CENTERED:', config.name, center, size, distance);

    }


    // ======================================
    // LOAD ALL MODELS
    // ======================================

    for (let i = 0; i < MODELS.length; i++) {
      await loadModel(MODELS[i], i);
    }


    // ======================================
    // SHOW MODEL
    // ======================================

    function showModel(index) {

      currentIndex = (index + MODELS.length) % MODELS.length;

      pivots.forEach((pivot, i) => {
        pivot.visible = i === currentIndex;
      });

      tagGroups.forEach((group, i) => {
        group.forEach(t => t.el.classList.toggle('on', i === currentIndex));
      });

      hoveringTag = false;
      activePivot = pivots[currentIndex];

      camera.position.set(0, 0, distances[currentIndex]);
      camera.lookAt(0, 0, 0);
      camera.updateProjectionMatrix();

      counter.textContent =
        String(currentIndex + 1).padStart(2, '0') +
        ' / ' +
        String(MODELS.length).padStart(2, '0');

    }

    document.getElementById('previous').addEventListener('click', () => showModel(currentIndex - 1));
    document.getElementById('next').addEventListener('click', () => showModel(currentIndex + 1));

    showModel(0);


    // ======================================
    // ROTATION
    // ======================================

    const canvas = renderer.domElement;

    canvas.addEventListener('pointerdown', (e) => {
      dragging = true;
      previousX = e.clientX;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointerup', () => { dragging = false; });
    canvas.addEventListener('pointercancel', () => { dragging = false; });

    canvas.addEventListener('pointermove', (e) => {
      if (!dragging || !activePivot) return;
      activePivot.rotation.y += (e.clientX - previousX) * 0.005;
      previousX = e.clientX;
    });

    status.style.display = 'none';


    // ======================================
    // TAG POSITIONING (follows the model)
    // ======================================

    const tmp = new THREE.Vector3();

    function updateTags() {

      const group = tagGroups[currentIndex];
      if (!group) return;

      const w = viewer.clientWidth;
      const h = viewer.clientHeight;

      group.forEach(t => {

        t.anchor.getWorldPosition(tmp);
        tmp.project(camera);

        const x = (tmp.x * 0.5 + 0.5) * w;
        const y = (-tmp.y * 0.5 + 0.5) * h;

        t.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';

      });

    }


    // ======================================
    // ANIMATION LOOP
    // ======================================

    renderer.setAnimationLoop(() => {

      // model pauses while a title is hovered, so it is easy to click
      if (!dragging && !hoveringTag && activePivot) {
        activePivot.rotation.y += 0.0015;
      }

      renderer.render(scene, camera);
      updateTags();

    });


    // ======================================
    // RESPONSIVE
    // ======================================

    window.addEventListener('resize', () => {

      const width = viewer.clientWidth;
      const height = viewer.clientHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);

    });

    console.log('ALL MODELS LOADED SUCCESSFULLY');

  }

  catch (error) {

    console.error('MODEL ERROR:', error);
    status.style.display = 'block';
    status.textContent = 'MODEL FAILED: ' + error.message;

  }

}

start();

</script>
